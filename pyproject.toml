[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "greatapi"
dynamic = ["version"]
description = "The batteries-included FastAPI framework: admin, auth, migrations, jobs and streaming out of the box."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sahaj Raj Malla", email = "mallasahajraj@gmail.com" }]
keywords = [
    "fastapi",
    "framework",
    "admin",
    "asgi",
    "async",
    "api",
    "llm",
    "ai",
    "agents",
    "streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# Base install: a complete general-purpose web framework. No LLM dependency.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "jinja2>=3.1.4",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "pwdlib[argon2,bcrypt]>=0.2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Everything needed to build an AI/agentic backend.
ai = ["httpx>=0.27", "anthropic>=0.40", "openai>=1.50"]
# Single-provider installs, for people who want a slimmer image.
anthropic = ["httpx>=0.27", "anthropic>=0.40"]
openai = ["httpx>=0.27", "openai>=1.50"]
# Self-hosted / OpenAI-compatible endpoints (Ollama, vLLM, LM Studio, ...).
local = ["httpx>=0.27"]
postgres = ["asyncpg>=0.29"]
all = ["greatapi[ai,postgres]"]

dev = [
    "greatapi[all]",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    "pre-commit>=3.7",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/sahajrajmalla/greatapi"
Documentation = "https://greatapi.readthedocs.io"
Repository = "https://github.com/sahajrajmalla/greatapi"
Changelog = "https://github.com/sahajrajmalla/greatapi/blob/master/CHANGELOG.md"
Issues = "https://github.com/sahajrajmalla/greatapi/issues"

[project.scripts]
greatapi = "greatapi.cli:main"

[tool.hatch.version]
path = "src/greatapi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/greatapi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtin shadowing
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "T20", # print statements
    "SIM", # simplify
    "PTH", # use pathlib
    "RUF",
    "ASYNC",
    "S",   # bandit
]
ignore = [
    "S101",  # assert is fine in tests, and ruff's per-file ignores handle the rest
    "B008",  # FastAPI's Depends()/Query() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# conftest sets environment variables before importing greatapi, which is
# the whole point of doing it there, so module-level imports come after.
"tests/conftest.py" = ["E402"]
"tests/**" = ["S105", "S106", "S311", "T20", "ARG001", "ARG002"]
"src/greatapi/conf/**/*.py-tpl" = ["ALL"]
"examples/**" = ["T20"]
# Charts build SVG from values this module escapes itself; Markup is the point.
"src/greatapi/admin/charts.py" = ["S704"]

[tool.ruff.lint.isort]
known-first-party = ["greatapi"]

[tool.mypy]
python_version = "3.10"
files = ["src/greatapi"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "pwdlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "requires_ai: needs the optional AI dependencies (greatapi[ai])",
    "slow: excluded from the default fast run",
]

[tool.coverage.run]
source = ["greatapi"]
branch = true
omit = ["*/conf/project_template/*", "*/conf/app_template/*", "*/db/migrations/versions/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]
