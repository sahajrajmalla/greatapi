version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine bumps; security updates still come through on their own.
      python-packages:
        patterns: ["*"]
        update-types: [minor, patch]
